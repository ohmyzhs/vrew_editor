[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrew-auto-editor"
version = "0.2.2"
description = "Local, cross-platform automation for Vrew project files"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vrew-auto = "vrew_auto_editor.cli:main"
vrew-auto-gui = "vrew_auto_editor.gui:main"

[tool.setuptools.packages.find]
include = ["vrew_auto_editor*"]
